<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1125" viewBox="0 0 900 1125" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="base" cx="0.4" cy="0.35" r="1.1">
      <stop offset="0" stop-color="#96938c"/>
      <stop offset="0.6" stop-color="#88857e"/>
      <stop offset="1" stop-color="#7a7770"/>
    </radialGradient>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="4" seed="9" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.28  0 0 0 0 0.27  0 0 0 0 0.25  0 0 0 0.35 -0.05"/>
    </filter>
    <filter id="pores">
      <feTurbulence type="turbulence" baseFrequency="0.09" numOctaves="3" seed="21" result="p"/>
      <feColorMatrix in="p" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.15  0 0 0 0 0.14  0 0 0 0.9 -0.55"/>
    </filter>
    <filter id="lights">
      <feTurbulence type="turbulence" baseFrequency="0.16" numOctaves="2" seed="33" result="l"/>
      <feColorMatrix in="l" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.92  0 0 0 0 0.89  0 0 0 0.5 -0.32"/>
    </filter>
  </defs>
  <rect width="900" height="1125" fill="url(#base)"/>
  <rect width="900" height="1125" filter="url(#rough)"/>
  <rect width="900" height="1125" filter="url(#pores)" opacity="0.55"/>
  <rect width="900" height="1125" filter="url(#lights)" opacity="0.4"/>
</svg>
